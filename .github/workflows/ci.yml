name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Syntax & config check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.13" ]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the package
        run: python -m compileall -q flighthub run.py

      - name: Validate the example config
        run: python -c "import json; json.load(open('config/config.example.json'))"

      - name: Check the bot source for non-English text
        run: |
          if grep -rIlP '[\p{Hiragana}\p{Katakana}\p{Han}]' --include='*.py' flighthub run.py; then
            echo "::error::Non-English characters were found in the bot source listed above."
            exit 1
          fi
