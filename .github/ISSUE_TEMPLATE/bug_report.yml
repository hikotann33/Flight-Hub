name: バグ報告
description: Flight Hub の不具合を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。まず既存の Issue を検索してください。
        Bot トークンなどの機密情報は記載しないでください。
  - type: textarea
    id: what-happened
    attributes:
      label: 発生した問題
      description: バグの内容を具体的に書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
      description: 本来どのように動作すべきかを書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. `/...` を実行する
        2. 「...」をクリックする
        3. エラーが発生する
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flight Hub のバージョン
      placeholder: v2 (2.0.0)
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python のバージョン
      placeholder: "3.13"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 関連するログ・スクリーンショット
      description: トレースバックやコンソール出力を貼り付けてください（機密情報は除く）。
      render: shell
    validations:
      required: false
